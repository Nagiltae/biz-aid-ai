name: biz-aid-ai
services:
  phase0:
    image: python:3.11-slim
    working_dir: /workspace
    entrypoint: ["python3", "-B", "/workspace/scripts/phase0.py"]
    command: ["--help"]
    network_mode: none
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/workspace:ro
      - ./data:/data
      - ./harness/workspace/artifacts:/artifacts
    tmpfs:
      - /tmp
  mysql:
    image: mysql:8.4
    profiles: [dev-db, app]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biz_aid_dev}
      MYSQL_USER: ${MYSQL_USER:-biz_aid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    volumes:
      - mysql_dev:/var/lib/mysql
      - ./infra/mysql/init-dev.sql:/docker-entrypoint-initdb.d/01-dev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  flyway:
    image: redgate/flyway:11
    platform: linux/amd64
    profiles: [dev-db]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:mysql://mysql:3306/biz_aid_dev?allowPublicKeyRetrieval=true&useSSL=false}
      FLYWAY_USER: ${MYSQL_USER:-biz_aid}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-}
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: ["validate"]
  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: [dev-vector, app]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_dev:/qdrant/storage
  backend:
    build: ./backend
    profiles: [app]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biz_aid_dev}
      MYSQL_USER: ${MYSQL_USER:-biz_aid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FLYWAY_LOCATIONS: filesystem:/migrations
      # compose 안에서는 FastAPI 컨테이너를 부른다. host FastAPI를 쓰려면 COMPOSE_AI_BASE_URL=http://host.docker.internal:8000.
      AI_BASE_URL: ${COMPOSE_AI_BASE_URL:-http://fastapi:8000}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-3s}
      AI_RESPONSE_TIMEOUT: ${AI_RESPONSE_TIMEOUT:-90s}
      INTERNAL_AI_API_KEY: ${INTERNAL_AI_API_KEY:-}
      # 공통 계약(기업 지역 표준명 등). FastAPI와 같은 파일을 읽기 전용으로 쓴다.
      BIZAID_CONTRACTS_PATH: /contracts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./migrations:/migrations:ro
      - ./contracts:/contracts:ro
  fastapi:
    # 질문 처리 전용 이미지(IMP-017). 코드·계약·모델은 읽기 전용 mount, 코드가 바뀌면 uvicorn --reload가 다시 시작한다.
    build: ./data-pipeline
    profiles: [app]
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    # .env.dev 전체를 넘기지 않고 질문 처리에 필요한 값만 넘긴다. 주소는 컨테이너 네트워크 기준으로 고정한다.
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biz_aid_dev}
      MYSQL_USER: ${MYSQL_USER:-biz_aid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAMESPACE: ${QDRANT_COLLECTION_NAMESPACE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      INTERNAL_AI_API_KEY: ${INTERNAL_AI_API_KEY:-}
      BIZAID_TRACING_ENABLED: ${BIZAID_TRACING_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      BIZAID_DOCLING_ARTIFACTS_PATH: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data-pipeline/src:/app/data-pipeline/src:ro
      - ./contracts:/app/contracts:ro
      # 모델은 이미지에 넣지 않고 host artifact 폴더를 읽기 전용으로 붙인다. 질문 서버는 BGE-M3 범위만 검증한다(IMP-005).
      - ${BIZAID_DOCLING_ARTIFACTS_PATH:-${HOME}/.cache/biz-aid/docling-artifacts}:/models:ro
  frontend:
    build: ./frontend
    profiles: [app]
    depends_on:
      backend:
        condition: service_started
        # WHY: nginx는 시작할 때 backend 이름을 IP로 한 번만 바꿔 둔다. backend가 다시 만들어지거나 재시작되면
        # 예전 IP로 보내 502가 나므로, Compose가 backend를 바꿀 때 frontend도 함께 다시 시작한다.
        restart: true
    ports:
      - "127.0.0.1:3000:80"
volumes:
  mysql_dev:
  qdrant_dev:
