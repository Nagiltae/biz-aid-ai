name: biz-aid-ai
services:
  phase0:
    image: python:3.11-slim
    working_dir: /workspace
    entrypoint: ["python3", "-B", "/workspace/scripts/phase0.py"]
    command: ["--help"]
    network_mode: none
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/workspace:ro
      - ./data:/data
      - ./harness/workspace/artifacts:/artifacts
    tmpfs:
      - /tmp
