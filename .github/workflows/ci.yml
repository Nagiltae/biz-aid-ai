name: Harness validation
on:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check current environment
        run: ./scripts/setup.sh
      - name: Validate current scope
        run: ./scripts/check-all.sh
