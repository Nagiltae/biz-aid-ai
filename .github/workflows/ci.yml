name: Harness validation
on:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # CI의 임시 test DB 전용 합성값이며 사용자 Secret과 운영 Credential을 사용하지 않는다.
    env:
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: biz_aid_dev
      MYSQL_USER: biz_aid
      MYSQL_PASSWORD: ci-only-synthetic-password
      MYSQL_ROOT_PASSWORD: ci-only-synthetic-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install structured pipeline dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r data-pipeline/requirements.txt
      # Docling 모델은 Git에 넣지 않고 Contract의 모델 identity로 만든 key의 Actions cache로 공급한다.
      - name: Resolve Docling artifact location and cache key
        id: docling
        run: |
          echo "BIZAID_DOCLING_ARTIFACTS_PATH=$HOME/.cache/biz-aid/docling-artifacts" >> "$GITHUB_ENV"
          echo "key=$(.venv/bin/python -B scripts/provision_docling_artifacts.py cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore Docling artifacts
        id: docling-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/biz-aid/docling-artifacts
          key: ${{ steps.docling.outputs.key }}
      # 네트워크 다운로드는 cache miss일 때 이 명시적 provisioning step에서만 허용한다.
      - name: Provision Docling artifacts (network, cache miss only)
        if: steps.docling-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
        run: .venv/bin/python -B scripts/provision_docling_artifacts.py provision --allow-network
      # cache hit도 그대로 믿지 않고 Contract의 manifest identity와 대조한 뒤에만 사용·저장한다.
      - name: Verify Docling artifacts identity
        env:
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -B scripts/provision_docling_artifacts.py verify
      - name: Save Docling artifacts
        if: steps.docling-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/biz-aid/docling-artifacts
          key: ${{ steps.docling.outputs.key }}
      - name: Check current environment
        env:
          HF_HUB_OFFLINE: "1"
        run: ./scripts/setup.sh
      - name: Validate current scope
        env:
          HF_HUB_OFFLINE: "1"
        run: ./scripts/check-all.sh
