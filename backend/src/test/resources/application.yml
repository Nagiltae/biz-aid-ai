# 테스트는 격리된 H2(MySQL 호환 모드)에서 실행한다. 실제 dev MySQL 데이터에 쓰지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:bizaid;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

bizaid:
  login-throttle:
    max-failures: 5
    lock-duration: 10m
  maintenance:
    # 테스트에서는 스케줄이 저절로 돌지 않게 하고(cron "-"), 정리 메서드를 직접 호출해 검사한다.
    cron: "-"
    stale-step-cron: "-"
    trial-cron: "-"
    refresh-token-retention: 30d
    login-throttle-retention: 1d
    workflow-inactive-expiry: 14d
    finished-workflow-retention: 90d
    usage-counter-retention: 7d
  usage:
    daily-limit: 30
    trial:
      enabled: true
      ttl: 24h
      daily-pool-limit: 200
      max-creates-per-ip-per-day: 1000
  legal:
    terms-version: "2026-10-04"
    privacy-version: "2026-10-04"
  # 테스트는 backend/에서 실행하므로 저장소의 공통 계약을 그대로 읽는다(복사본 없음).
  contracts-path: ../contracts
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256-0123456789
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  refresh-cookie:
    name: bizaid_refresh
    path: /api/auth
    secure: false
  service-zone: Asia/Seoul
  # 기본 테스트는 AI 서버가 없는 주소를 가리킨다(연결 실패 → ai_service_unavailable). AI 연결 테스트는 가짜 서버 주소로 덮어쓴다.
  ai:
    base-url: http://127.0.0.1:9
    connect-timeout: 1s
    response-timeout: 2s
    api-key: test-internal-key
