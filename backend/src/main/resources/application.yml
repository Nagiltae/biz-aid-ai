# 모든 환경의 공통 설정. 환경마다 달라지는 값(DB 주소·AI 주소·Cookie 보안·로그 수준)은 application-{dev,prod}.yml에 둔다.
# 비밀값(DB 비밀번호·JWT_SECRET·INTERNAL_AI_API_KEY)은 어떤 설정 파일에도 쓰지 않고 환경변수로만 받는다.
# profile을 지정하지 않으면 dev로 실행한다(IntelliJ 직접 실행·Compose 개발 흐름 유지). 운영은 SPRING_PROFILES_ACTIVE=prod.
spring:
  application:
    name: bizaid-backend
  profiles:
    default: dev
  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    # 공통 migrations/ 계보(flyway_schema_history)를 그대로 쓴다. 두 번째 migration 체계를 만들지 않는다.
    clean-disabled: true
    validate-migration-naming: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${BACKEND_PORT:8080}
  # 접속 IP(로그인 시도 제한)를 nginx가 넣은 X-Forwarded-For로 정한다. Tomcat은 내부망 proxy(127/8·10/8·172.16/12·192.168/16)만 믿는다.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

bizaid:
  # 로그인 시도 제한(2026-10-04 사용자 결정): 계정·접속 IP 각각 5회 연속 실패 → 10분 잠금.
  login-throttle:
    max-failures: 5
    lock-duration: 10m
  # 정리 작업(IMP-016·021). 시각은 서비스 시간대(Asia/Seoul) cron이다.
  maintenance:
    cron: "0 30 4 * * *"
    stale-step-cron: "0 */5 * * * *"
    # 체험 계정 정리(생성 24시간 지난 계정 삭제)는 매시 15분에 돈다.
    trial-cron: "0 15 * * * *"
    refresh-token-retention: 30d
    login-throttle-retention: 1d
    workflow-inactive-expiry: 14d
    finished-workflow-retention: 90d
    usage-counter-retention: 7d
  # 하루 AI 사용 제한·체험 계정(2026-10-04 묶음5-1 사용자 결정). 한국 시간 자정에 새로 센다.
  usage:
    daily-limit: ${BIZAID_AI_DAILY_LIMIT:10}
    daily-limit-per-ip: ${BIZAID_AI_DAILY_LIMIT_PER_IP:30}
    global-daily-limit: ${BIZAID_AI_GLOBAL_DAILY_LIMIT:300}
    signup-per-ip-per-day: ${BIZAID_SIGNUP_PER_IP_PER_DAY:5}
    trial:
      # 운영 on/off. 기본은 끔이고 dev profile만 켠다. 운영은 BIZAID_TRIAL_ENABLED=true로 켠다.
      enabled: ${BIZAID_TRIAL_ENABLED:false}
      ttl: 24h
      daily-pool-limit: ${BIZAID_TRIAL_DAILY_POOL_LIMIT:200}
      max-creates-per-ip-per-day: ${BIZAID_TRIAL_MAX_CREATES_PER_IP:20}
  # 이용약관·개인정보처리방침 현재 버전(시행일). 화면 frontend/src/features/legal/legalVersions.ts와 같아야 한다.
  legal:
    terms-version: "2026-10-05.1"
    privacy-version: "2026-10-05.1"
  # 공통 계약 폴더(기업 지역 표준명 등). IntelliJ(working dir backend/)는 ../contracts, Compose는 /contracts mount.
  contracts-path: ${BIZAID_CONTRACTS_PATH:../contracts}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  refresh-cookie:
    name: bizaid_refresh
    path: /api/auth
  service-zone: Asia/Seoul
  # FastAPI 내부 AI API. 응답 제한시간이 긴 이유: 로컬 Qwen이 목록 검색 10~16초, 자격 판정 25~36초 걸린다. 자동 재시도는 하지 않는다.
  ai:
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    response-timeout: ${AI_RESPONSE_TIMEOUT:90s}
    # 서비스 간 인증 공유 키. FastAPI와 같은 값을 환경변수로만 받는다.
    api-key: ${INTERNAL_AI_API_KEY:}

# API 문서는 기본으로 끈다. dev profile만 켠다(운영에 내부 API 구조를 공개하지 않음).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
