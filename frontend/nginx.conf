# React 정적 파일을 제공하고 /api만 Spring Boot로 넘긴다.
# 브라우저 입장에서 화면과 API가 같은 origin이라 CORS가 필요 없고 Refresh Token Cookie도 그대로 오간다.
# FastAPI로 가는 경로는 두지 않는다(React는 Spring만 호출한다).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # BOUNDARY: 브라우저가 보낸 X-Forwarded-For를 이어 붙이지 않고 실제 접속 주소로 덮어쓴다(로그인 시도 제한의 IP 위조 방지).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx 기본 응답 대기(60초)가 Spring AI 제한시간(90초)보다 짧으면 정상 판정 단계를 먼저 끊는다.
        # Spring이 먼저 504/오류 본문으로 끝낼 수 있게 여유를 둔다(Spring 제한시간은 바꾸지 않음).
        proxy_read_timeout 120s;
    }

    # React Router가 처리하는 주소(/programs/123 등)를 새로고침해도 index.html을 준다.
    location / {
        try_files $uri /index.html;
    }
}
