# React 정적 파일을 제공하고 /api만 Spring Boot로 넘긴다.
# 브라우저 입장에서 화면과 API가 같은 origin이라 CORS가 필요 없고 Refresh Token Cookie도 그대로 오간다.
# FastAPI로 가는 경로는 두지 않는다(React는 Spring만 호출한다).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router가 처리하는 주소(/programs/123 등)를 새로고침해도 index.html을 준다.
    location / {
        try_files $uri /index.html;
    }
}
